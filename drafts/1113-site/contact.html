<body class="pg">
<nav class="nav" aria-label="Site"><a href="index.html">home page</a><a href="work.html">projects</a></nav>
<button class="mb" type="button" aria-label="Menu" aria-expanded="false" aria-controls="mn"><i aria-hidden="true"></i></button>
<div class="mn" id="mn" hidden><nav aria-label="Menu"><a href="index.html">About</a><a href="work.html">Projects</a><a href="resume.html">Resume</a><a href="contact.html" aria-current="page">Contact</a></nav></div>
<main class="abt ctc">
  <h1>Contact</h1>
  <p class="lead">Send a message to Minho Song. I'll reply to the email you enter.<br><span lang="ko">메시지를 남겨주시면 입력하신 메일로 답장드립니다.</span></p>
  <form id="contact" class="cf">
    <label>Name · 이름 <input name="name" maxlength="100" autocomplete="name" required></label>
    <label>Your email · 답장 받을 메일 <input name="email" type="email" maxlength="254" autocomplete="email" required></label>
    <label>Message · 내용 <textarea name="message" maxlength="5000" required></textarea></label>
    <div class="hpot" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
    <button type="submit">Send · 보내기</button>
    <p id="status" role="status"></p>
  </form>
</main>
<p class="end"><a href="work.html">projects</a><a href="resume.html">resume</a></p>
<script src="app.js?v=20261117-jm3f"></script>
<script>
(function(){
  var API='https://s-home.catfish-teeth.ts.net',form=document.getElementById('contact'),status=document.getElementById('status'),t=Date.now();
  form.addEventListener('submit',async function(e){
    e.preventDefault();
    var btn=form.querySelector('button');btn.disabled=true;status.textContent='Sending…';
    var data=Object.fromEntries(new FormData(form));
    try{
      var r=await fetch(API+'/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({},data,{t:t}))});
      if(r.ok){form.reset();status.textContent='Sent. Thank you! · 전송되었습니다. 감사합니다!'}
      else{var j=await r.json().catch(function(){return{}});
        status.textContent=r.status===429?'Too many messages. Please try again later. · 잠시 후 다시 시도해주세요.'
          :(j.error==='invalid input'?'Please check your email address and message. · 메일 주소와 내용을 확인해주세요.':'Something went wrong. Please try again. · 오류가 발생했습니다.')}
    }catch(err){status.textContent='Network error. Please try again. · 네트워크 오류입니다.'}
    btn.disabled=false;
  });
})();
</script>
</body>
