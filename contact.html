<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Minho Design</title>
<style>
  body { max-width: 560px; margin: 64px auto; padding: 0 24px; font: 15px/1.6 system-ui, sans-serif; color: #222; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  .muted { color: #777; font-size: 13px; }
  label { display: block; margin-top: 18px; font-size: 13px; color: #555; }
  input, textarea { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  textarea { min-height: 160px; resize: vertical; }
  button { margin-top: 20px; padding: 10px 22px; border: 0; border-radius: 6px; background: #111; color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  #status { margin-top: 14px; font-size: 14px; }
</style>
</head>
<body>

<h1>Contact</h1>
<p class="muted">Send a message to Minho Song. I'll reply to the email you enter. · 메시지를 남겨주시면 입력하신 메일로 답장드립니다.</p>

<form id="contact">
  <label>Name · 이름 <input name="name" maxlength="100" required></label>
  <label>Your email · 답장 받을 메일 <input name="email" type="email" maxlength="254" required></label>
  <label>Message · 내용 <textarea name="message" maxlength="5000" required></textarea></label>
  <div class="hp" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
  <button type="submit">Send · 보내기</button>
  <p id="status" role="status"></p>
</form>

<script>
  const API = 'https://s-home.catfish-teeth.ts.net';
  const form = document.getElementById('contact');
  const status = document.getElementById('status');
  const t = Date.now();
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = form.querySelector('button');
    btn.disabled = true;
    status.textContent = 'Sending…';
    const data = Object.fromEntries(new FormData(form));
    try {
      const r = await fetch(API + '/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...data, t }),
      });
      if (r.ok) {
        form.reset();
        status.textContent = 'Sent. Thank you! · 전송되었습니다. 감사합니다!';
      } else {
        const j = await r.json().catch(() => ({}));
        status.textContent = r.status === 429 ? 'Too many messages. Please try again later. · 잠시 후 다시 시도해주세요.'
          : (j.error === 'invalid input' ? 'Please check your email address and message. · 메일 주소와 내용을 확인해주세요.' : 'Something went wrong. Please try again. · 오류가 발생했습니다.');
      }
    } catch {
      status.textContent = 'Network error. Please try again. · 네트워크 오류입니다.';
    }
    btn.disabled = false;
  });
</script>

</body>
</html>
